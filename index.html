<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título principal - optimizado para SEO y pestañas -->
    <title>LQC | League Querétaro Championship - Torneo Competitivo LoL</title>
    
    <!-- Meta descripción (máx 160 chars recomendados) -->
    <meta name="description" content="Torneo competitivo de League of Legends en Querétaro. Inscripciones abiertas, premios en efectivo, transmisiones en vivo y comunidad apasionada.">
    
    <!-- Palabras clave -->
    <meta name="keywords" content="League of Legends, LQC, torneo LoL Querétaro, esports Querétaro, campeonato League, gaming competitivo México">
    
    <!-- Autor y derechos -->
    <meta name="author" content="League Querétaro Championship">
    <!-- Sin año: un <meta> es estático y envejecería solo (el footer usa getFullYear). -->
    <meta name="copyright" content="© LQC - League Querétaro Championship">
    
    <!-- Robots (permite indexación) -->
    <meta name="robots" content="index, follow" />
    
    <!-- Solo el .ico: los PNG de 16/32/180/192/512 no existen en public/, y el
         site.webmanifest tampoco tiene bloque `icons`. Ver "Iconos y favicon" en AGENTS.md. -->
    <link rel="icon" type="image/x-icon" href="/LOGO-COPA.ico" />

    <!-- Manifest para PWA (agregar a pantalla de inicio en móviles) -->
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Color del tema (barra navegador en móviles) -->
    <meta name="theme-color" content="#1e40af" /> <!-- Azul fuerte oscuro -->
    <meta name="msapplication-TileColor" content="#1e40af" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lqc.revolution505.com/" />
    <meta property="og:title" content="LQC | League Querétaro Championship" />
    <meta property="og:description" content="El torneo más competitivo de League of Legends en Querétaro. Inscripciones, transmisiones en vivo y premios." />
    <!-- PROVISIONAL: falta una imagen propia de 1200x630. Esta es 1024x1024 y el trofeo
         está cortado contra el borde izquierdo, así que la tarjeta sale con el logo a
         medias y mucho negro. No cambiar a 2 LQC.png ni a LOGO COPA.png: son RGBA con
         fondo transparente y los scrapers aplanan el alfa contra blanco — quedarían
         blanco sobre blanco, invisibles. width/height evitan que la primera vez que se
         comparta el enlace la tarjeta salga sin imagen. -->
    <meta property="og:image" content="https://lqc.revolution505.com/assets/lqc-trophy-logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Logo de la League Querétaro Championship" />
    <meta property="og:site_name" content="LQC Querétaro" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lqc.revolution505.com/" />
    <meta name="twitter:title" content="LQC | League Querétaro Championship" />
    <meta name="twitter:description" content="Torneo competitivo LoL en Querétaro - Inscripciones abiertas" />
    <meta name="twitter:image" content="https://lqc.revolution505.com/assets/lqc-trophy-logo.jpg" />
    <meta name="twitter:image:alt" content="Logo de la League Querétaro Championship" />
    
    <!-- Preconexión y DNS prefetch para rendimiento -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://player.twitch.tv" />
    
    <!-- Fuentes Google (Inter + Orbitron) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Structured Data (JSON-LD) - Mejorado -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "League Querétaro Championship",
      "url": "https://lqc.revolution505.com",
      "logo": "https://lqc.revolution505.com/assets/2%20LQC.png",
      "description": "Torneo competitivo oficial de League of Legends en Querétaro, México.",
      "sameAs": [
        "https://twitch.tv/lqroc",
        "https://www.facebook.com/lolqrochampionship/",
        "https://discord.gg/eS6zkvfkp"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "contactolqc@revolution505.com"
      }
    }
    </script>

    <!-- Google Site Verification (mantengo tu código) -->
    <meta name="google-site-verification" content="GGVdUy9BdmfosqQ7JzIbabEMoc0pTiSN-latJEY66IM" />
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- NoScript fallback (mejorado visualmente) -->
    <noscript>
      <div style="position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; z-index: 9999;">
        <img src="/assets/2 LQC.png" alt="LQC Logo" style="height: 80px; margin-bottom: 1.5rem;" />
        <h1 style="font-size: 2.2rem; margin-bottom: 1rem; color: #3b82f6;">JavaScript está deshabilitado</h1>
        <p style="font-size: 1.2rem; max-width: 500px; margin-bottom: 2rem;">
          Para ver la transmisión en vivo, la galería y el registro de equipos, habilita JavaScript en tu navegador.
        </p>
        <p style="color: #666; font-size: 1rem;">
          Este sitio es una experiencia dinámica construida con React.
        </p>
      </div>
    </noscript>
  </body>
</html>
